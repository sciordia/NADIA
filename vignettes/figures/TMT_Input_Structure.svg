<?xml version="1.0" encoding="utf-8"?>
<svg viewBox="0 0 1200 520" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg">
  <title id="title">Structure of a Proteome Discoverer TMT input report</title>
  <desc id="desc">A wide-format table with one protein group per row. Global protein and identification annotations appear first, followed by one abundance column for every TMT channel. The design comes from abundance suffixes or annot_path.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#17324d" flood-opacity="0.13"/>
    </filter>
    <style>
      .h1{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.sub{font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#526779}.group{font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.head{font:600 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#17324d}.cell{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#334e60}.noteh{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17324d}.note{font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334e60}.small{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#526779}.grid{stroke:#b9c7d2;stroke-width:1}.box{filter:url(#shadow);stroke-width:1.5}
    </style>
  </defs>
  <rect width="1200" height="520" rx="18" fill="#f8fafc"/>
  <text class="h1" x="32" y="43" style="white-space: pre;">TMT report from Proteome Discoverer — wide format</text>
  <text class="sub" x="32" y="70" style="white-space: pre;">One row represents one protein group; each TMT channel occupies one abundance column</text>
  <rect class="box" x="30" y="102" width="835" height="344" rx="10" fill="#fff" stroke="#d69a65"/>
  <rect x="32" y="104" width="455" height="38" fill="#ffedd5"/>
  <rect x="487" y="104" width="376" height="38" fill="#fef3c7"/>
  <text class="group" x="182" y="129" style="white-space: pre;">Global protein and ID annotations</text>
  <text class="group" x="589" y="129" style="white-space: pre;">TMT channel intensities</text>
  <rect x="30" y="142" width="835" height="58" fill="#fff8f1"/>
  <rect x="30" y="258" width="835" height="58" fill="#fffdf8"/>
  <path class="grid" d="M 165 141.901 L 165 446 M 285 141.569 L 285 446 M 390 141.38 L 390 446 M 487 102 L 487 446 M 615 141.629 L 615 446 M 743 141.784 L 743 446 M 30 142 L 865 142 M 30 200 L 865 200 M 30 258 L 865 258 M 30 316 L 865 316 M 30 374 L 865 374"/>
  <text class="head" x="59" y="177" style="white-space: pre; font-size: 13px;">Accession</text>
  <text class="head" x="181" y="177" style="white-space: pre; font-size: 13px;">Description</text>
  <text class="head" x="313" y="177" style="white-space: pre; font-size: 13px;"># PSMs</text>
  <text class="head" x="407" y="177" style="white-space: pre; font-size: 13px;">Coverage</text>
  <text class="head" x="512" y="169" style="white-space: pre; font-size: 13px;">Abundance:</text>
  <text class="head" x="537" y="188" style="white-space: pre; font-size: 13px;">A_1</text>
  <text class="head" x="640" y="169" style="white-space: pre; font-size: 13px;">Abundance:</text>
  <text class="head" x="665" y="188" style="white-space: pre; font-size: 13px;">A_2</text>
  <text class="head" x="768" y="169" style="white-space: pre; font-size: 13px;">Abundance:</text>
  <text class="head" x="789" y="188" style="white-space: pre; font-size: 13px;">IS_1</text>
  <g class="cell">
    <text x="78" y="235" style="white-space: pre; font-size: 13px;">P001</text>
    <text x="189" y="235" style="white-space: pre; font-size: 13px;">Protein 1</text>
    <text x="322" y="235" style="white-space: pre; font-size: 13px;">6332</text>
    <text x="426" y="235" style="white-space: pre; font-size: 13px;">54%</text>
    <text x="528" y="235" style="white-space: pre; font-size: 13px;">126.4</text>
    <text x="656" y="235" style="white-space: pre; font-size: 13px;">118.9</text>
    <text x="784" y="235" style="white-space: pre; font-size: 13px;">94.2</text>
    <text x="78" y="293" style="white-space: pre; font-size: 13px;">P002</text>
    <text x="189" y="293" style="white-space: pre; font-size: 13px;">Protein 2</text>
    <text x="325" y="293" style="white-space: pre; font-size: 13px;">421</text>
    <text x="426" y="293" style="white-space: pre; font-size: 13px;">37%</text>
    <text x="531" y="293" style="white-space: pre; font-size: 13px;">82.1</text>
    <text x="659" y="293" style="white-space: pre; font-size: 13px;">79.8</text>
    <text x="784" y="293" style="white-space: pre; font-size: 13px;">65.0</text>
    <text x="78" y="351" style="white-space: pre; font-size: 13px;">P003</text>
    <text x="189" y="351" style="white-space: pre; font-size: 13px;">Protein 3</text>
    <text x="328" y="351" style="white-space: pre; font-size: 13px;">95</text>
    <text x="426" y="351" style="white-space: pre; font-size: 13px;">22%</text>
    <text x="530" y="351" style="white-space: pre; font-size: 13px;">14.7</text>
    <text x="659" y="351" style="white-space: pre; font-size: 13px;">16.2</text>
    <text x="784" y="351" style="white-space: pre; font-size: 13px;">12.8</text>
    <text x="88" y="409" style="white-space: pre; font-size: 13px;">…</text>
    <text x="215" y="409" style="white-space: pre; font-size: 13px;">…</text>
    <text x="332" y="409" style="white-space: pre; font-size: 13px;">…</text>
    <text x="431" y="409" style="white-space: pre; font-size: 13px;">…</text>
    <text x="541" y="409" style="white-space: pre; font-size: 13px;">…</text>
    <text x="671" y="409" style="white-space: pre; font-size: 13px;">…</text>
    <text x="798" y="409" style="white-space: pre; font-size: 13px;">…</text>
  </g>
  <rect class="box" x="900" y="102" width="270" height="344" rx="12" fill="#fff8ef" stroke="#ea580c"/>
  <text class="noteh" x="925" y="139" style="white-space: pre;">How NADIA reads it</text>
  <circle cx="927" cy="181" r="5" fill="#ea580c"/>
  <text class="note" x="943" y="186" style="white-space: pre;">Design from suffixes</text>
  <text class="head" x="943" y="210" style="white-space: pre;">&lt;Condition&gt;_&lt;Replicate&gt;</text>
  <text class="note" x="943" y="239" style="white-space: pre;">or from</text>
  <text class="head" x="1002" y="239" style="white-space: pre;">annot_path</text>
  <circle cx="927" cy="285" r="5" fill="#d97706"/>
  <text class="note" x="943" y="290" style="white-space: pre;">Global ID metrics apply to</text>
  <text class="note" x="943" y="312" style="white-space: pre;">the protein, not one channel</text>
  <circle cx="927" cy="357" r="5" fill="#2563eb"/>
  <text class="note" x="943" y="362" style="white-space: pre;">condition_order can omit</text>
  <text class="head" x="943" y="384" style="white-space: pre;">IS</text>
  <text class="note" x="970" y="384" style="white-space: pre;">channels</text>
  <text class="small" x="925" y="416" style="white-space: pre;">preprocess_tmt()</text>
</svg>