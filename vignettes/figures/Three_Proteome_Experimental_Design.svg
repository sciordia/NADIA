<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850"
     viewBox="0 0 1500 850" role="img"
     aria-labelledby="title description">
  <title id="title">Three-proteome spike-in experimental design</title>
  <desc id="description">Four experimental conditions, A to D, each have four replicates. HeLa proteins remain at 80 percent. Escherichia coli proteins increase from 5 to 20 percent, while Saccharomyces cerevisiae proteins decrease from 15 percent to zero. Condition D contains no yeast proteins and is expected to have the highest missingness for yeast-derived protein groups.</desc>

  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .title { font-size: 42px; font-weight: 700; fill: #1d3557; }
      .subtitle { font-size: 22px; fill: #536271; }
      .legend { font-size: 19px; fill: #273444; }
      .condition { font-size: 29px; font-weight: 700; fill: #1d3557; }
      .condition-d { font-size: 29px; font-weight: 700; fill: #b4233a; }
      .small { font-size: 17px; fill: #596979; }
      .segment { font-size: 19px; font-weight: 700; fill: #ffffff; }
      .segment-dark { font-size: 18px; font-weight: 700; fill: #263238; }
      .trend { font-size: 19px; font-weight: 650; }
      .callout-head { font-size: 23px; font-weight: 700; fill: #9f1d35; }
      .callout-body { font-size: 19px; fill: #4d2831; }
      .foot { font-size: 17px; fill: #62717f; }
    </style>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#203040" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#16857b"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c87516"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b4233a"/>
    </marker>
  </defs>

  <rect width="1500" height="850" fill="#ffffff"/>

  <g class="sans">
    <text x="750" y="62" text-anchor="middle" class="title">Three-proteome spike-in experimental design</text>
    <text x="750" y="100" text-anchor="middle" class="subtitle">Four conditions · four pseudo-biological replicates per condition · 16 samples</text>

    <!-- Legend -->
    <g transform="translate(226 128)">
      <rect x="0" y="0" width="22" height="22" rx="4" fill="#5b7fa3"/>
      <text x="34" y="18" class="legend"><tspan font-style="italic">Homo sapiens</tspan> (HeLa background)</text>

      <rect x="400" y="0" width="22" height="22" rx="4" fill="#2a9d8f"/>
      <text x="434" y="18" class="legend"><tspan font-style="italic">Escherichia coli</tspan></text>

      <rect x="727" y="0" width="22" height="22" rx="4" fill="#e9a23b"/>
      <text x="761" y="18" class="legend"><tspan font-style="italic">Saccharomyces cerevisiae</tspan> (yeast)</text>
    </g>

    <!-- Column labels -->
    <text x="102" y="196" class="small" font-weight="650">CONDITION</text>
    <text x="218" y="196" class="small" font-weight="650">REPLICATES</text>
    <text x="340" y="196" class="small" font-weight="650">PROTEOME COMPOSITION (% OF TOTAL PROTEIN MASS)</text>

    <!-- Trends in the reciprocal spike-ins -->
    <line x1="1060" y1="187" x2="1190" y2="187" stroke="#16857b" stroke-width="3" marker-end="url(#arrow-teal)"/>
    <text x="1048" y="193" text-anchor="end" class="trend" fill="#16857b"><tspan font-style="italic">E. coli</tspan> 5 → 20%</text>
    <line x1="1060" y1="213" x2="1190" y2="213" stroke="#c87516" stroke-width="3" marker-end="url(#arrow-orange)"/>
    <text x="1048" y="219" text-anchor="end" class="trend" fill="#c87516">Yeast 15 → 0%</text>

    <!-- Row backgrounds -->
    <rect x="74" y="232" width="1330" height="84" rx="14" fill="#f7f9fb"/>
    <rect x="74" y="332" width="1330" height="84" rx="14" fill="#f7f9fb"/>
    <rect x="74" y="432" width="1330" height="84" rx="14" fill="#f7f9fb"/>
    <rect x="70" y="528" width="1338" height="92" rx="16" fill="#fff5f6" stroke="#d1495b" stroke-width="3"/>

    <!-- Conditions and replicate symbols -->
    <text x="127" y="284" text-anchor="middle" class="condition">A</text>
    <text x="127" y="384" text-anchor="middle" class="condition">B</text>
    <text x="127" y="484" text-anchor="middle" class="condition">C</text>
    <text x="127" y="584" text-anchor="middle" class="condition-d">D</text>

    <g fill="#ffffff" stroke="#5c6b78" stroke-width="2">
      <circle cx="211" cy="274" r="9"/><circle cx="237" cy="274" r="9"/><circle cx="263" cy="274" r="9"/><circle cx="289" cy="274" r="9"/>
      <circle cx="211" cy="374" r="9"/><circle cx="237" cy="374" r="9"/><circle cx="263" cy="374" r="9"/><circle cx="289" cy="374" r="9"/>
      <circle cx="211" cy="474" r="9"/><circle cx="237" cy="474" r="9"/><circle cx="263" cy="474" r="9"/><circle cx="289" cy="474" r="9"/>
      <circle cx="211" cy="574" r="9"/><circle cx="237" cy="574" r="9"/><circle cx="263" cy="574" r="9"/><circle cx="289" cy="574" r="9"/>
    </g>
    <text x="250" y="303" text-anchor="middle" class="small">n = 4</text>
    <text x="250" y="403" text-anchor="middle" class="small">n = 4</text>
    <text x="250" y="503" text-anchor="middle" class="small">n = 4</text>
    <text x="250" y="603" text-anchor="middle" class="small">n = 4</text>

    <!-- Exact 100% stacked mixtures; full width = 880 -->
    <!-- A: HeLa 80%, E. coli 5%, yeast 15% -->
    <g filter="url(#shadow)">
      <rect x="340" y="248" width="704" height="52" rx="8" fill="#5b7fa3"/>
      <rect x="1044" y="248" width="44" height="52" fill="#2a9d8f"/>
      <rect x="1088" y="248" width="132" height="52" rx="0" fill="#e9a23b"/>
    </g>
    <text x="692" y="281" text-anchor="middle" class="segment">HeLa 80%</text>
    <text x="1066" y="281" text-anchor="middle" class="segment" font-size="15">5%</text>
    <text x="1154" y="281" text-anchor="middle" class="segment-dark">Yeast 15%</text>

    <!-- B: HeLa 80%, E. coli 10%, yeast 10% -->
    <g filter="url(#shadow)">
      <rect x="340" y="348" width="704" height="52" rx="8" fill="#5b7fa3"/>
      <rect x="1044" y="348" width="88" height="52" fill="#2a9d8f"/>
      <rect x="1132" y="348" width="88" height="52" fill="#e9a23b"/>
    </g>
    <text x="692" y="381" text-anchor="middle" class="segment">HeLa 80%</text>
    <text x="1088" y="381" text-anchor="middle" class="segment" font-size="17">10%</text>
    <text x="1176" y="381" text-anchor="middle" class="segment-dark" font-size="17">10%</text>

    <!-- C: HeLa 80%, E. coli 15%, yeast 5% -->
    <g filter="url(#shadow)">
      <rect x="340" y="448" width="704" height="52" rx="8" fill="#5b7fa3"/>
      <rect x="1044" y="448" width="132" height="52" fill="#2a9d8f"/>
      <rect x="1176" y="448" width="44" height="52" fill="#e9a23b"/>
    </g>
    <text x="692" y="481" text-anchor="middle" class="segment">HeLa 80%</text>
    <text x="1110" y="481" text-anchor="middle" class="segment"><tspan font-style="italic">E. coli</tspan> 15%</text>
    <text x="1198" y="481" text-anchor="middle" class="segment-dark" font-size="15">5%</text>

    <!-- D: HeLa 80%, E. coli 20%, yeast 0% -->
    <g filter="url(#shadow)">
      <rect x="340" y="548" width="704" height="52" rx="8" fill="#5b7fa3"/>
      <rect x="1044" y="548" width="176" height="52" fill="#2a9d8f"/>
    </g>
    <text x="692" y="581" text-anchor="middle" class="segment">HeLa 80%</text>
    <text x="1132" y="581" text-anchor="middle" class="segment"><tspan font-style="italic">E. coli</tspan> 20%</text>
    <line x1="1220" y1="541" x2="1220" y2="607" stroke="#b4233a" stroke-width="4" stroke-dasharray="7 6"/>
    <text x="1242" y="566" class="callout-head" font-size="20">0% yeast</text>
    <text x="1242" y="592" class="small" fill="#9f1d35">structural absence</text>

    <!-- Constant background and spike-in bracket -->
    <line x1="340" y1="648" x2="1044" y2="648" stroke="#5b7fa3" stroke-width="3"/>
    <line x1="340" y1="641" x2="340" y2="655" stroke="#5b7fa3" stroke-width="3"/>
    <line x1="1044" y1="641" x2="1044" y2="655" stroke="#5b7fa3" stroke-width="3"/>
    <text x="692" y="680" text-anchor="middle" class="trend" fill="#466887">Constant HeLa background (80%)</text>

    <line x1="1044" y1="648" x2="1220" y2="648" stroke="#667684" stroke-width="3"/>
    <line x1="1220" y1="641" x2="1220" y2="655" stroke="#667684" stroke-width="3"/>
    <text x="1132" y="680" text-anchor="middle" class="trend" fill="#52616e">Reciprocal spike-ins (20%)</text>

    <!-- Main interpretive callout -->
    <rect x="250" y="715" width="1000" height="82" rx="16" fill="#fff1f3" stroke="#d1495b" stroke-width="2"/>
    <circle cx="302" cy="756" r="23" fill="#d1495b"/>
    <text x="302" y="764" text-anchor="middle" font-size="27" font-weight="800" fill="#ffffff">D</text>
    <text x="345" y="750" class="callout-head">Condition D contains no yeast proteins</text>
    <text x="345" y="779" class="callout-body">It is therefore expected to show the highest missingness for yeast-derived protein groups.</text>

  </g>
</svg>
