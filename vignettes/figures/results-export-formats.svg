<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">Choosing an output format for a NADIA analysis</title>
  <desc id="desc">A NADIA analysis branches into four complementary output formats: TSV files, Parquet files, a NADIA archive, and interactive HTML. Each format is described by its best use, main advantage, and main consideration.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#78909c"/>
    </marker>
    <style>
      .title { font: 600 34px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #17324d; }
      .subtitle { font: 400 19px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #516779; }
      .source-title { font: 600 25px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #ffffff; text-anchor: middle; }
      .source-subtitle { font: 400 17px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #e7f0f6; text-anchor: middle; }
      .card-title { font: 600 25px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #ffffff; }
      .label { font: 700 15px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; letter-spacing: 1.1px; }
      .body { font: 400 18px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #263746; }
      .flow { stroke: #78909c; stroke-width: 2.2; fill: none; }
      .arrow { stroke: #78909c; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .divider { stroke: #d8e1e7; stroke-width: 1.3; }
      .icon { stroke: #ffffff; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1500" height="900" fill="#ffffff"/>

  <text x="40" y="50" class="title">Choosing a NADIA output format</text>
  <text x="40" y="82" class="subtitle">Select the format according to how the result will be inspected, exchanged, preserved, or presented.</text>

  <rect x="450" y="108" width="600" height="86" rx="10" fill="#24557a"/>
  <text x="750" y="146" class="source-title">NADIA analysis</text>
  <text x="750" y="176" class="source-subtitle">One analysis can support several complementary outputs</text>

  <path d="M750 194 V226" class="flow"/>
  <path d="M202 226 H1298" class="flow"/>
  <path d="M202 226 V260" class="arrow"/>
  <path d="M567 226 V260" class="arrow"/>
  <path d="M932 226 V260" class="arrow"/>
  <path d="M1297 226 V260" class="arrow"/>

  <!-- TSV -->
  <rect x="35" y="270" width="335" height="550" rx="10" fill="#f5f9fd" stroke="#aac7dc" stroke-width="1.5"/>
  <path d="M45 270 H360 A10 10 0 0 1 370 280 V352 H35 V280 A10 10 0 0 1 45 270 Z" fill="#3f78a8"/>
  <g transform="translate(58 291)">
    <rect x="0" y="0" width="38" height="40" rx="2" class="icon"/>
    <path d="M8 11 H30 M8 20 H30 M8 29 H30 M18 5 V35" class="icon"/>
  </g>
  <text x="113" y="321" class="card-title">TSV files</text>
  <text x="57" y="389" class="label" fill="#2d648f">BEST USE</text>
  <text x="57" y="422" class="body">
    <tspan x="57" dy="0">Inspection in text editors,</tspan>
    <tspan x="57" dy="25">spreadsheets, and general-</tspan>
    <tspan x="57" dy="25">purpose software</tspan>
  </text>
  <line x1="57" y1="501" x2="348" y2="501" class="divider"/>
  <text x="57" y="535" class="label" fill="#2d648f">MAIN ADVANTAGE</text>
  <text x="57" y="568" class="body">
    <tspan x="57" dy="0">Human-readable and</tspan>
    <tspan x="57" dy="25">widely supported</tspan>
  </text>
  <line x1="57" y1="634" x2="348" y2="634" class="divider"/>
  <text x="57" y="668" class="label" fill="#2d648f">MAIN CONSIDERATION</text>
  <text x="57" y="701" class="body">
    <tspan x="57" dy="0">Several related files must</tspan>
    <tspan x="57" dy="25">be kept together</tspan>
  </text>

  <!-- Parquet -->
  <rect x="400" y="270" width="335" height="550" rx="10" fill="#f4faf7" stroke="#a9d0c1" stroke-width="1.5"/>
  <path d="M410 270 H725 A10 10 0 0 1 735 280 V352 H400 V280 A10 10 0 0 1 410 270 Z" fill="#3b8b72"/>
  <g transform="translate(422 292)">
    <path d="M2 8 L20 0 L38 8 L20 16 Z M2 18 L20 26 L38 18 M2 28 L20 36 L38 28" class="icon"/>
  </g>
  <text x="477" y="321" class="card-title">Parquet files</text>
  <text x="422" y="389" class="label" fill="#2d715d">BEST USE</text>
  <text x="422" y="422" class="body">
    <tspan x="422" dy="0">Typed exchange of large</tspan>
    <tspan x="422" dy="25">tables and matrices</tspan>
  </text>
  <line x1="422" y1="501" x2="713" y2="501" class="divider"/>
  <text x="422" y="535" class="label" fill="#2d715d">MAIN ADVANTAGE</text>
  <text x="422" y="568" class="body">
    <tspan x="422" dy="0">Preserves column types and</tspan>
    <tspan x="422" dy="25">is efficient to read</tspan>
  </text>
  <line x1="422" y1="634" x2="713" y2="634" class="divider"/>
  <text x="422" y="668" class="label" fill="#2d715d">MAIN CONSIDERATION</text>
  <text x="422" y="701" class="body">
    <tspan x="422" dy="0">Requires software with</tspan>
    <tspan x="422" dy="25">Parquet support</tspan>
  </text>

  <!-- NADIA archive -->
  <rect x="765" y="270" width="335" height="550" rx="10" fill="#fffaf0" stroke="#dfc58e" stroke-width="1.5"/>
  <path d="M775 270 H1090 A10 10 0 0 1 1100 280 V352 H765 V280 A10 10 0 0 1 775 270 Z" fill="#c98718"/>
  <g transform="translate(787 290)">
    <ellipse cx="20" cy="7" rx="19" ry="7" class="icon"/>
    <path d="M1 7 V32 C1 36 10 39 20 39 C30 39 39 36 39 32 V7 M1 20 C1 24 10 27 20 27 C30 27 39 24 39 20" class="icon"/>
  </g>
  <text x="842" y="321" class="card-title">.nadia archive</text>
  <text x="787" y="389" class="label" fill="#9b6510">BEST USE</text>
  <text x="787" y="422" class="body">
    <tspan x="787" dy="0">Preserving and restoring a</tspan>
    <tspan x="787" dy="25">complete NADIA analysis</tspan>
  </text>
  <line x1="787" y1="501" x2="1078" y2="501" class="divider"/>
  <text x="787" y="535" class="label" fill="#9b6510">MAIN ADVANTAGE</text>
  <text x="787" y="568" class="body">
    <tspan x="787" dy="0">Keeps data, parameters,</tspan>
    <tspan x="787" dy="25">provenance, and optional</tspan>
    <tspan x="787" dy="25">clustering together</tspan>
  </text>
  <line x1="787" y1="659" x2="1078" y2="659" class="divider"/>
  <text x="787" y="693" class="label" fill="#9b6510">MAIN CONSIDERATION</text>
  <text x="787" y="726" class="body">
    <tspan x="787" dy="0">Requires NADIA or</tspan>
    <tspan x="787" dy="25">DuckDB-compatible tools</tspan>
    <tspan x="787" dy="25">to inspect its contents</tspan>
  </text>

  <!-- Interactive HTML -->
  <rect x="1130" y="270" width="335" height="550" rx="10" fill="#faf7fc" stroke="#cbb9da" stroke-width="1.5"/>
  <path d="M1140 270 H1455 A10 10 0 0 1 1465 280 V352 H1130 V280 A10 10 0 0 1 1140 270 Z" fill="#8064a2"/>
  <g transform="translate(1152 292)">
    <rect x="0" y="0" width="42" height="36" rx="3" class="icon"/>
    <path d="M0 9 H42 M7 5 H8 M13 5 H14 M19 5 H20 M10 20 L16 26 L28 15" class="icon"/>
  </g>
  <text x="1208" y="321" class="card-title">Interactive HTML</text>
  <text x="1152" y="389" class="label" fill="#664b88">BEST USE</text>
  <text x="1152" y="422" class="body">
    <tspan x="1152" dy="0">Exploring or presenting</tspan>
    <tspan x="1152" dy="25">results without writing</tspan>
    <tspan x="1152" dy="25">R code</tspan>
  </text>
  <line x1="1152" y1="501" x2="1443" y2="501" class="divider"/>
  <text x="1152" y="535" class="label" fill="#664b88">MAIN ADVANTAGE</text>
  <text x="1152" y="568" class="body">
    <tspan x="1152" dy="0">Sorting, filtering, search,</tspan>
    <tspan x="1152" dy="25">and interactive graphics</tspan>
  </text>
  <line x1="1152" y1="634" x2="1443" y2="634" class="divider"/>
  <text x="1152" y="668" class="label" fill="#664b88">MAIN CONSIDERATION</text>
  <text x="1152" y="701" class="body">
    <tspan x="1152" dy="0">May need an accompanying</tspan>
    <tspan x="1152" dy="25">dependency folder unless</tspan>
    <tspan x="1152" dy="25">saved as one file</tspan>
  </text>

  <text x="750" y="862" class="subtitle" text-anchor="middle">The formats can be combined: preservation, exchange, and presentation do not require the same output.</text>
</svg>
