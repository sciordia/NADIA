  <text x="714" y="265" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#ffffff" style="white-space: pre;">Human 80%</text>
  <text x="750" y="319" text-anchor="middle" class="composition" style="white-space: pre;"><tspan font-style="italic">E. coli</tspan> 10% · yeast 10%</text>
  <text x="750" y="353" text-anchor="middle" class="composition-strong" style="white-space: pre;">Replicates B_1–B_8</text>
  <text x="750" y="380" text-anchor="middle" class="note" style="white-space: pre;">intermediate reciprocal spike-in</text>
