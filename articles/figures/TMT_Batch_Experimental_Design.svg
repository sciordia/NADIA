    <text x="386" y="17" class="legend" style="white-space: pre;">yeast</text>
  </g>
  <text x="750" y="474" text-anchor="middle" class="composition-strong" style="white-space: pre;">Eight replicates from each condition are split evenly between the two mixes</text>
