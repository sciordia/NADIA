  <rect x="1338" y="232" width="72" height="52" fill="#2a9d8f"/>
  <text x="1194" y="265" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#ffffff" style="white-space: pre;">Human 80%</text>
  <text x="1230" y="319" text-anchor="middle" class="composition" style="white-space: pre;"><tspan font-style="italic">E. coli</tspan> 20% · yeast 0%</text>
  <text x="1230" y="353" text-anchor="middle" class="composition-strong" style="white-space: pre;">Replicates D_1–D_8</text>
  <text x="1230" y="380" text-anchor="middle" class="note" style="white-space: pre;">highest <tspan font-style="italic">E. coli</tspan> · no yeast</text>
  <g transform="translate(438 420)">
