  <rect x="396" y="232" width="54" height="52" rx="0" fill="#e9a23b"/>
  <text x="234" y="265" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#ffffff" style="white-space: pre;">Human 80%</text>
  <text x="270" y="319" text-anchor="middle" class="composition" style="white-space: pre;"><tspan font-style="italic">E. coli</tspan> 5% · yeast 15%</text>
  <text x="270" y="353" text-anchor="middle" class="composition-strong" style="white-space: pre;">Replicates A_1–A_8</text>
  <text x="270" y="380" text-anchor="middle" class="note" style="white-space: pre;">low <tspan font-style="italic">E. coli</tspan> · highest yeast</text>
  <g filter="url(#shadow)">
    <rect x="535" y="155" width="430" height="245" rx="16" fill="#f8fafc" stroke="#a9bac9" stroke-width="2"/>
  </g>
