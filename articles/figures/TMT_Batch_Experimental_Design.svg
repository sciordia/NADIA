<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="930" viewBox="0 0 1500 930" role="img" aria-labelledby="title description">
  <title id="title">Three-proteome TMT spike-in design across two labelling mixes</title>
  <desc id="description">Conditions A, B and D contain a constant 80 percent human background, increasing Escherichia coli and decreasing yeast proportions. Each condition has eight biological replicates. Replicates one to four are assigned to TMTpro mix 1 and replicates five to eight to TMTpro mix 2. Each mix therefore contains four replicates from every condition, plus two internal-standard channels.</desc>
  <defs>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="135%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#263746" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60717f"/>
    </marker>
    <style>
      .title { font: 700 37px Arial, Helvetica, sans-serif; fill: #1d3557; }
      .subtitle { font: 400 20px Arial, Helvetica, sans-serif; fill: #52616e; }
      .section { font: 700 17px Arial, Helvetica, sans-serif; letter-spacing: 1px; fill: #536271; }
      .condition { font: 700 28px Arial, Helvetica, sans-serif; fill: #1d3557; }
      .composition { font: 400 18px Arial, Helvetica, sans-serif; fill: #3f4d58; }
      .composition-strong { font: 700 18px Arial, Helvetica, sans-serif; fill: #263746; }
      .mix-title { font: 700 27px Arial, Helvetica, sans-serif; fill: #1d3557; }
      .mix-subtitle { font: 400 18px Arial, Helvetica, sans-serif; fill: #52616e; }
      .row-label { font: 700 19px Arial, Helvetica, sans-serif; }
      .chip { font: 700 17px Menlo, Consolas, monospace; fill: #243746; }
      .note { font: 400 17px Arial, Helvetica, sans-serif; fill: #5b6873; }
      .footer { font: 700 19px Arial, Helvetica, sans-serif; fill: #2f5f55; }
      .legend { font: 400 17px Arial, Helvetica, sans-serif; fill: #3f4d58; }
    </style>
  </defs>
  <rect width="1500" height="930" fill="#ffffff"/>
  <text x="750" y="54" text-anchor="middle" class="title" style="white-space: pre;">Three-proteome TMT design across two labelling mixes</text>
  <text x="750" y="89" text-anchor="middle" class="subtitle" style="white-space: pre;">Three biological conditions · eight replicates per condition · balanced allocation across two TMTpro mixes</text>
  <text x="72" y="133" class="section" style="white-space: pre;">BIOLOGICAL SPIKE-IN COMPOSITION</text>
