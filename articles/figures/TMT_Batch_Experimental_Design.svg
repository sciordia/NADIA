    <text x="30" y="17" class="legend" style="white-space: pre;">human</text>
    <rect x="172" y="0" width="20" height="20" rx="4" fill="#2a9d8f"/>
    <text x="202" y="17" class="legend" style="white-space: pre;"><tspan font-style="italic">E. coli</tspan></text>
